# CodeQL analysis of the Swift sources, run on every branch and pull request so findings
# surface before a change reaches main.
#
# Swift needs a traced build (it has no build mode "none"), and CodeQL cannot trace builds on
# macOS 27 or with Xcode 27. So this runs on macOS 26 with an Xcode 26 release, whose Swift
# (6.3) is within the range CodeQL supports. Keep the Xcode pin on 26.x until CodeQL supports
# the newer toolchain.

name: CodeQL

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'   # weekly, so new queries also run against unchanged code
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # upload results to code scanning

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          swift --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      # The same build as `just build`, without the commit stamp: output goes to build.noindex.
      - name: Build
        run: swift build --scratch-path build.noindex --force-resolved-versions

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:swift
