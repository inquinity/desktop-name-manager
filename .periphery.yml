# Unused-code scan, run by scripts/periphery.sh (spec 001, task T007).
# The public API of DesktopNameCore is kept because the later app links it.
retain_public: true
retain_codable_properties: true
# SwiftUI views' `body` and AppKit's `@objc` entry points are used by the frameworks, not by our code (spec 014).
retain_objc_accessible: true
retain_swift_ui_previews: true
# Report findings in shipping code only; test helpers and the development-only editor prototype are not the target
# of this gate.
report_exclude:
  - "Tests/**"
  - "prototype/**"
  # SwiftPM checkouts of dependencies live in the scratch folder, not in .build
  - "build.noindex/**"
